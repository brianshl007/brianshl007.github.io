<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brian Lee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --ink: #111111;
      --dim: #888888;
      --faint: #e8e8e8;
      --blue: #2d5fa6;
      --mono: 'DM Mono', 'Courier New', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 300;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: var(--bg);
    }

    .nav-name {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--ink); }
    .nav-links a.active { color: var(--ink); }

    .nav-jeep-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .nav-jeep-link:hover { opacity: 1; }
    .nav-jeep-link img {
      height: 22px;
      width: 36px;
      object-fit: cover;
      display: block;
      border-radius: 2px;
      background: #dce8f5;
    }

    /* ─── PAGE TITLE ─── */
    .page-title {
      padding: 4.5rem 1.25rem 1.5rem;
    }

    .page-title h1 {
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    /* ─── GRID ─── */
    .grid-wrap {
      display: flex;
      justify-content: center;
      padding: 0 1.25rem 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 200px);
      gap: 16px;
      background: transparent;
    }

    .grid-item {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--bg);
      position: relative;
    }

    .grid-thumb {
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
    }

    .grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
    }

    .grid-item:hover .grid-thumb img { opacity: 0.85; }

    .grid-thumb.ph { background: #ebebeb; }
    .grid-thumb.ph-blue { background: #dce8f5; }

    .grid-count {
      position: absolute;
      bottom: 0.4rem;
      left: 0.5rem;
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      color: #fff;
      background: rgba(0,0,0,0.35);
      padding: 0.1rem 0.3rem;
      line-height: 1.4;
      pointer-events: none;
    }

    .grid-caption {
      padding: 0.45rem 0.5rem 0.7rem;
    }

    .grid-name {
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--ink);
      display: block;
    }

    .grid-item:hover .grid-name { color: var(--dim); }
    .grid-item.blue-entry .grid-name { color: var(--blue); }
    .grid-item.blue-entry:hover .grid-name { color: #1a3a6b; }

    /* ─── FOOTER ─── */
    footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--faint);
      display: flex;
      justify-content: space-between;
    }

    footer span {
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      color: #cccccc;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 700px) {
      .grid-wrap { padding: 0 1rem 3rem; }
      .grid { grid-template-columns: repeat(2, 1fr); width: 100%; gap: 12px; }
    }
    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
</head>
<body>

  <nav>
    <a class="nav-name" href="index.html">Brian Lee</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Works</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="blue-jeeps.html" class="nav-jeep-link"><img src="assets/blue-jeep-1.jpg?v=3" alt="Blue Jeeps" onerror="this.style.display='none'"></a></li>
    </ul>
  </nav>

  <div class="page-title">
    <h1>Works</h1>
  </div>

  <section id="work">
    <div class="grid-wrap">
      <div class="grid">

        <a class="grid-item" href="folk-computer.html">
          <div class="grid-thumb">
            <img src="assets/folk-desk.jpg" alt="Folk Computer">
            <span class="grid-count">3</span>
          </div>
          <div class="grid-caption">
            <span class="grid-name">Folk Computer</span>
          </div>
        </a>

        <a class="grid-item" href="cad-modeling.html">
          <div class="grid-thumb">
            <img src="assets/cad-render-2.png" alt="CAD & 3D Modeling">
            <span class="grid-count">4</span>
          </div>
          <div class="grid-caption">
            <span class="grid-name">CAD &amp; 3D Modeling</span>
          </div>
        </a>

        <a class="grid-item" href="#">
          <div class="grid-thumb ph"></div>
          <div class="grid-caption">
            <span class="grid-name">Ceramics</span>
          </div>
        </a>

        <a class="grid-item" href="#">
          <div class="grid-thumb ph"></div>
          <div class="grid-caption">
            <span class="grid-name">Zines &amp; Print</span>
          </div>
        </a>

        <a class="grid-item" href="#">
          <div class="grid-thumb ph"></div>
          <div class="grid-caption">
            <span class="grid-name">Built Objects</span>
          </div>
        </a>

        <a class="grid-item" href="#">
          <div class="grid-thumb ph"></div>
          <div class="grid-caption">
            <span class="grid-name">Folk2 Launch Party</span>
          </div>
        </a>

        <a class="grid-item" href="#">
          <div class="grid-thumb ph"></div>
          <div class="grid-caption">
            <span class="grid-name">Arc Reactor Model</span>
          </div>
        </a>

        <a class="grid-item" href="#">
          <div class="grid-thumb ph"></div>
          <div class="grid-caption">
            <span class="grid-name">Physical Interfaces</span>
          </div>
        </a>

        <a class="grid-item blue-entry" href="blue-jeeps.html">
          <div class="grid-thumb ph-blue">
            <img src="assets/blue-jeep-1.jpg?v=3" alt="Blue Jeeps" onerror="this.style.display='none'">
            <span class="grid-count">9</span>
          </div>
          <div class="grid-caption">
            <span class="grid-name">Blue Jeeps</span>
          </div>
        </a>

      </div>
    </div>
  </section>

  <footer>
    <span>Brian Lee</span>
    <span>© 2026</span>
  </footer>

  <div id="tweaks-root"></div>
  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "gridColumns": 3,
      "gap": 16,
      "showCaptions": true,
      "bgColor": "#ffffff"
    }/*EDITMODE-END*/;

    function TweaksApp() {
      const { values, set } = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        const grid = document.querySelector('.grid');
        if (!grid) return;
        grid.style.gridTemplateColumns = `repeat(${values.gridColumns}, 200px)`;
        grid.style.gap = values.gap + 'px';
        document.documentElement.style.setProperty('--bg', values.bgColor);
        document.querySelectorAll('.grid-caption').forEach(el => {
          el.style.display = values.showCaptions ? '' : 'none';
        });
      }, [values]);

      return (
        <TweaksPanel title="Tweaks">
          <TweakSection label="Grid">
            <TweakSlider label="Columns" id="gridColumns" min={1} max={4} step={1} />
            <TweakSlider label="Gap (px)" id="gap" min={0} max={48} step={4} />
            <TweakToggle label="Show Captions" id="showCaptions" />
          </TweakSection>
          <TweakSection label="Color">
            <TweakColor label="Background" id="bgColor" />
          </TweakSection>
        </TweaksPanel>
      );
    }

    ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<TweaksApp />);
  </script>

</body>
</html>
