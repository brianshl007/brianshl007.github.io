<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Brian Lee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --ink: #111111;
      --dim: #888888;
      --faint: #e8e8e8;
      --blue: #2d5fa6;
      --mono: 'DM Mono', 'Courier New', monospace;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 300;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: var(--bg);
    }

    .nav-name {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--ink); }
    .nav-links a.active { color: var(--ink); }
    .nav-links a.blue { color: var(--blue); }
    .nav-links a.blue:hover { color: #1a3a6b; }

    .nav-jeep-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .nav-jeep-link:hover { opacity: 1; }
    .nav-jeep-link img {
      height: 22px;
      width: 36px;
      object-fit: cover;
      display: block;
      border-radius: 2px;
    }

    .page-title {
      padding: 4.5rem 1.25rem 1.5rem;
    }

    .page-title h1 {
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .about-body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1.25rem 5rem;
    }

    .about-photo {
      width: 200px;
      flex-shrink: 0;
    }

    .about-photo img {
      width: 200px;
      height: 267px;
      object-fit: cover;
      display: block;
    }

    .about-text {
      width: 200px;
      flex-shrink: 0;
    }

    .about-text p {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      line-height: 1.85;
      color: var(--dim);
      text-align: right;
    }

    footer {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      background: var(--bg);
    }

    footer span {
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      color: #cccccc;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-name" href="index.html">Brian Lee</a>
    <ul class="nav-links">
      <li><a href="index.html">Works</a></li>
      <li><a href="about.html" class="active">About</a></li>
      <li><a href="blue-jeeps.html" class="nav-jeep-link"><img src="assets/blue-jeep-1.jpg" alt="Blue Jeeps"></a></li>
    </ul>
  </nav>

  <div class="page-title">
    <h1>About</h1>
  </div>

  <div class="about-body">
    <div class="about-photo">
      <img src="assets/brian-portrait.jpg?v=2" alt="Brian Lee at Frieze Week">
    </div>
    <div class="about-text">
      <p>I am Soo Hyung Brian Lee (이수형), a human being from South Korea, and currently residing in Brooklyn, NY. I indulge in creations made by fellow humans, some with function and utility and some completely without.</p>
    </div>
  </div>

  <footer>
    <span>Brian Lee</span>
    <span>© 2026</span>
  </footer>

</body>
</html>
